services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./app:/app/app"]
    healthcheck:
      {
        test:
          [
            "CMD",
            "python",
            "-c",
            "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
          ],
        interval: 10s,
        timeout: 5s,
        retries: 5,
      }
  worker:
    build: .
    command: arq app.workers.tasks.WorkerSettings
    env_file:
      - .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes: ["./app:/app/app"]
  migrator:
    build: .
    command: alembic upgrade head
    restart: "no"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
    depends_on: { db: { condition: service_healthy } }
  db:
    image: postgres:16-alpine
    environment:
      {
        POSTGRES_USER: Scanlyst,
        POSTGRES_PASSWORD: Scanlyst,
        POSTGRES_DB: Scanlyst,
      }
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U Scanlyst -d Scanlyst"],
        interval: 5s,
        timeout: 5s,
        retries: 10,
      }
  redis:
    image: redis:7-alpine
    volumes: [redis_data:/data]
    healthcheck:
      {
        test: ["CMD", "redis-cli", "ping"],
        interval: 5s,
        timeout: 3s,
        retries: 10,
      }
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/cloudflare.conf:/etc/nginx/cloudflare.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres_data:
  redis_data:
