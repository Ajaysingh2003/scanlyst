# Virtual host configuration for api.scanlyst.dev (Proxied via Cloudflare)

# 1. HTTP Server (Port 80)
# Handles Cloudflare HTTP origin connections (Flexible/Full mode)
server {
    listen 80;
    listen [::]:80;
    server_name api.scanlyst.dev;

    # Health check endpoint for container / load balancer probes
    location = /health {
        proxy_pass http://fastapi_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main API reverse proxy
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # Header forwarding (Restores real client IP via Cloudflare)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeouts for long-running scanner / report exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Proxy Buffers (Prevents Cloudflare 520 / upstream sent too big header)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}

# 2. HTTPS Server (Port 443)
# Handles Cloudflare HTTPS origin connections (Full / Full Strict mode)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.scanlyst.dev;

    # SSL Certificates (Cloudflare Origin CA Certificate or fallback self-signed)
    ssl_certificate /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Health check endpoint
    location = /health {
        proxy_pass http://fastapi_backend/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main API reverse proxy
    location / {
        proxy_pass http://fastapi_backend;
        proxy_http_version 1.1;

        # Header forwarding (Restores real client IP via Cloudflare)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header CF-Ray $http_cf_ray;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket & Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Extended timeouts for long-running scanner / report exports
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Proxy Buffers (Prevents Cloudflare 520 / upstream sent too big header)
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Security Headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
